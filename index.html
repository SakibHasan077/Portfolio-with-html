<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Header Section Start */
    header{
      width: 100%;
      height: fit-content;
      background-color: rgba(97, 96, 96, 0.336);
      padding: 10px;
    }
    nav{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 20px;
      padding-right: 20px;
    }
    nav ul{
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }
    nav ul a{
      text-decoration: none;
      color: black;
      font-size: 20px;
    }
    /* Header Section End */
    /* Hero Section Start */
    main{
      height: calc(100vh - 70px);
      /* background-color: brown; */
      display: flex;
      justify-content: space-between;
      padding-left: 70px;
    }

    .hero-content{
      margin-top: 130px;
    }

    .hero-content h1{
      font-size: 45px;
      margin-bottom: 1.5rem;
    }

    .hero-content h1 span {
      color: cadetblue;
    }

    .hero-content p{
      font-size: 22px;
      margin-bottom: 3rem;
    }
    .hero-buttons button{
      background-color: cadetblue;
      color: aliceblue;
      border: 0;
      padding: 15px 30px;
      cursor: pointer;
      margin-right: 10px;
      border-radius: 10px;
    }

    .hero-img img{
      height: 100%;
    }

    /* Hero Section End */

  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <a href="#">
          <img src="./images/logo.png" alt="Logo">
        </a>
      </div>
      <div class="navItem">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Skills</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">Gallery</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </nav>

  </header>
  <!-- Hero Section -->
  <main>
    <div class="hero-content">

      <h1>Hi, I am <span>Hridoy Islam</span></h1>

      <p>Beginner MERN Stack Developer</p>

      <div class="hero-buttons">

        <button>Download CV</button>

        <button>Contact Me</button>
        
      </div>
    </div>
    <div class="hero-img">
      <img src="./images/hero-pic.jpg" alt="Hero Picture">
    </div>
  </main>
</body>
</html>
